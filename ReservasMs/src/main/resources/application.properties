# 1. Nombre del Microservicio
spring.application.name=ms-reservas

# 2. Puerto
server.port=8083

# 3. Configuración de Base de Datos
spring.datasource.url=jdbc:mariadb://localhost:3306/db_reservas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 4. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 5. Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 6. ENLACES ENTRE SERVICIOS (Usando RestTemplate nativo)
servicio.canchas.url=http://localhost:8082/api/canchas
servicio.usuarios.url=http://localhost:8081/api/usuarios