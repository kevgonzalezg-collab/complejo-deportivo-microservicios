spring.application.name=horariosms
server.port=8097

spring.datasource.url=jdbc:mariadb://localhost:3306/db_horarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuramos Hibernate en update para que ajuste tablas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway configurado para gestionar las migraciones
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.main.web-application-type=servlet