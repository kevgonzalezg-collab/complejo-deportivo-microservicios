spring.application.name=notificacionesms
server.port=8085

# 🔄 Apuntando al puerto 3306 y a tu base de datos real: bd_notificaciones
spring.datasource.url=jdbc:mariadb://localhost:3306/bd_notificaciones
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 🔧 Lo dejamos en update por si tu modelo necesita crear tablas en esa BD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Apagamos Flyway
spring.flyway.enabled=false