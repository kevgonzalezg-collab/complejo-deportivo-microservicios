server.port=8098
spring.application.name=seguridadms

# Conexión directa a tu base de datos real bd_seguridad
spring.datasource.url=jdbc:mariadb://localhost:3306/bd_seguridad
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate creará la tabla 'credencial' automáticamente en bd_seguridad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false