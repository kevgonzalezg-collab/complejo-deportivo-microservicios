spring.application.name=ms-pagos
server.port=8097

# Base de datos propia en XAMPP
spring.datasource.url=jdbc:mariadb://localhost:3306/db_pagos
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ? CAMBIO AQUÍ: Le decimos a Hibernate que cree la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ? CAMBIO AQUÍ: Apagamos Flyway temporalmente para arrancar limpios
spring.flyway.enabled=false

# ENLACE: Pagos necesita llamar a Reservas
servicio.reservas.url=http://localhost:8099/api/reservas