spring.application.name=ms-usuarios
server.port=8084

# ConexiÃ³n limpia a tu base de datos de XAMPP
spring.datasource.url=jdbc:mariadb://localhost:3306/db_usuarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Apagamos la creación automática de Hibernate y lo dejamos en modo revisión
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Encendemos Flyway para que sea el jefe absoluto de la base de datos
spring.flyway.enabled=true