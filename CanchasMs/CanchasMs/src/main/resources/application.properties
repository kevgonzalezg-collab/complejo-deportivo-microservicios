server.port=8082
spring.application.name=ms-canchas

spring.datasource.url=jdbc:mariadb://localhost:3306/db_canchas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Apagamos la creación automática de Hibernate y lo dejamos en modo revisión
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Encendemos Flyway para que sea el jefe absoluto de la base de datos
spring.flyway.enabled=true


servicio.estadisticas.url=http://localhost:8095/api/estadisticas