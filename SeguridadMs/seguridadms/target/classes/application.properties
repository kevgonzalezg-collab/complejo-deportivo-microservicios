server.port=8091
spring.application.name=seguridadms

# Conexión directa a tu base de datos real bd_seguridad
spring.datasource.url=jdbc:mariadb://localhost:3306/db_seguridad
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Apagamos la creaci�n autom�tica de Hibernate y lo dejamos en modo revisi�n
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Encendemos Flyway para que sea el jefe absoluto de la base de datos
spring.flyway.enabled=true