spring.application.name=ms-usuarios
server.port=8081

# Conexión limpia a tu base de datos de XAMPP
spring.datasource.url=jdbc:mariadb://localhost:3306/db_usuarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 📢 CAMBIO MAESTRO: Le ordenamos a Hibernate que cree la tabla vacía basándose en tu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 📢 CAMBIO CRÍTICO: Apagamos Flyway para que deje de bloquear el inicio del servidor
spring.flyway.enabled=false